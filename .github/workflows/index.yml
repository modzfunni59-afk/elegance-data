name: Générer index.json

on:
  push:
    paths:
      - 'data/**'
      - '!data/index.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Voir ce qu'il y a dans data
        run: |
          echo "--- contenu de data ---"
          ls -la data || echo "PAS DE DOSSIER data"

      - name: Fabriquer l'index
        run: python3 .github/scripts/generer-index.py

      - name: Publier s'il a changé
        run: |
          git config user.name "elegance-bot"
          git config user.email "actions@github.com"
          git add data/index.json

          if git diff --staged --quiet; then
            echo "Index inchangé, rien à publier."
          else
            git commit -m "index: mise à jour automatique"
            git pull --rebase --autostash
            git push
            echo "Index publié."
          fi
